<!-- Pinned opposite the theme switch (top-right) so the two never overlap. -->
<div
  class="group fixed left-4 top-4 z-50 flex items-center rounded-full border border-border/60 bg-card/80 px-1.5 py-1.5 shadow-sm backdrop-blur-md md:left-8 md:top-8"
  role="status"
  aria-live="polite"
>
  @if (healthQuery.isPending()) {
  <svg
    lucideLoaderCircle
    class="size-2.5 animate-spin text-muted-foreground"
    aria-hidden="true"
  ></svg>
  } @else {
  <span
    class="size-2.5 rounded-full ring-4 {{ statusDot() }}"
    aria-hidden="true"
  >
  </span>
  }
  <span
    class="ml-0 grid grid-cols-[0fr] transition-all duration-300 ease-out group-hover:ml-2 group-hover:grid-cols-[1fr]"
  >
    <span
      class="min-w-0 overflow-hidden whitespace-nowrap text-xs font-medium tracking-wide text-muted-foreground"
    >
      {{ statusLabel() }}
    </span>
  </span>
</div>
