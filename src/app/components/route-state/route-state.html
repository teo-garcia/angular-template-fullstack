<section
  class="flex min-h-svh flex-col items-center justify-center gap-8 px-6 py-16 text-center"
  [attr.aria-live]="variant() === 'loading' ? 'polite' : null"
  [attr.role]="role()"
>
  <div [class]="iconClass()" aria-hidden="true">●</div>
  <div class="flex max-w-xl flex-col items-center gap-3">
    <h1 class="text-4xl font-semibold tracking-normal md:text-6xl">
      {{ title() }}
    </h1>
    <p class="text-base leading-7 text-muted-foreground md:text-lg">
      {{ description() }}
    </p>
  </div>
  @if (details()) {
  <pre
    class="max-h-48 max-w-3xl overflow-auto rounded-md border border-border bg-muted px-4 py-3 text-left text-sm text-muted-foreground"
  >
      <code>{{ details() }}</code>
    </pre>
  }
  <div class="flex flex-wrap justify-center gap-3">
    <ng-content select="[actions]" />
  </div>
</section>
