<div
  class="fixed bottom-4 right-4 z-50 flex gap-2 rounded-md border border-border bg-card p-2 shadow-sm"
>
  <button
    class="rounded px-2 py-1 text-xs"
    type="button"
    [class.bg-primary]="preference() === 'light'"
    [class.text-primary-foreground]="preference() === 'light'"
    (click)="setPreference('light')"
  >
    Light
  </button>
  <button
    class="rounded px-2 py-1 text-xs"
    type="button"
    [class.bg-primary]="preference() === 'dark'"
    [class.text-primary-foreground]="preference() === 'dark'"
    (click)="setPreference('dark')"
  >
    Dark
  </button>
  <button
    class="rounded px-2 py-1 text-xs"
    type="button"
    [class.bg-primary]="preference() === 'system'"
    [class.text-primary-foreground]="preference() === 'system'"
    (click)="setPreference('system')"
  >
    System
  </button>
</div>
