<button
  type="button"
  class="fixed right-4 top-4 rounded-lg border p-2 transition-colors duration-200 hover:bg-accent hover:text-accent-foreground md:right-8 md:top-8"
  [attr.aria-label]="'Theme switcher, current mode: ' + preference()"
  [attr.title]="
    'Current theme: ' +
    preference() +
    '. Click to switch to ' +
    nextPreference()
  "
  (click)="cyclePreference()"
>
  @switch (preference()) { @case ('light') {
  <svg lucideSun class="size-5" aria-hidden="true"></svg>
  } @case ('dark') {
  <svg lucideMoon class="size-5" aria-hidden="true"></svg>
  } @default {
  <svg lucideLaptop class="size-5" aria-hidden="true"></svg>
  } }
</button>
