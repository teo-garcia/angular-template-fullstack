services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: angular_app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./angular.json:/app/angular.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.app.json:/app/tsconfig.app.json
    networks:
      - angular-network

networks:
  angular-network:
    driver: bridge
